name: Operator v8 checks
# Runs for pull requests, for pushes to main and by hand. Plain pushes to other branches do not start it.
# The Windows cargo tests moved to verify-native.yml: they run only when src-tauri/** changes.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request replaces the older run; runs on main always finish.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:reliability
      - run: npm run build
      - run: npm audit --audit-level=high
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: codex_chat_v8_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      CHAT_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/codex_chat_v8_test_ci
      PUSH_DRY_RUN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
