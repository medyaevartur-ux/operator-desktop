<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="1"/>
      <stop offset="55%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkle">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Tёплое сияние-фон -->
  <circle cx="512" cy="500" r="470" fill="url(#glow)"/>

  <!-- Книга -->
  <g filter="url(#shadow)">
    <!-- Обложка-подкладка -->
    <path d="M 192 296 Q 192 264 224 264 L 800 264 Q 832 264 832 296 L 832 760 Q 832 792 800 792 L 224 792 Q 192 792 192 760 Z"
          fill="url(#cover)"/>

    <!-- Левая страница -->
    <path d="M 232 308 L 504 308 L 504 752 L 264 752 Q 232 752 232 720 Z" fill="url(#book)"/>
    <!-- Правая страница -->
    <path d="M 792 308 L 520 308 L 520 752 L 760 752 Q 792 752 792 720 Z" fill="url(#book)"/>

    <!-- Корешок-тень между страницами -->
    <path d="M 504 308 Q 512 332 520 308 L 520 752 Q 512 728 504 752 Z" fill="#92400e" opacity="0.25"/>

    <!-- Тонкие строки на левой странице -->
    <g stroke="#d97706" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round">
      <line x1="278" y1="378" x2="466" y2="378"/>
      <line x1="278" y1="430" x2="450" y2="430"/>
      <line x1="278" y1="482" x2="466" y2="482"/>
      <line x1="278" y1="534" x2="430" y2="534"/>
    </g>
    <g stroke="#d97706" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round">
      <line x1="558" y1="378" x2="746" y2="378"/>
      <line x1="558" y1="430" x2="730" y2="430"/>
      <line x1="558" y1="482" x2="746" y2="482"/>
      <line x1="558" y1="534" x2="710" y2="534"/>
    </g>
  </g>

  <!-- Звезда по центру (5-конечная, золотая) -->
  <g transform="translate(512 600)">
    <polygon points="0,-160 47,-50 165,-50 70,22 105,140 0,72 -105,140 -70,22 -165,-50 -47,-50"
             fill="url(#star)" stroke="#92400e" stroke-width="6" stroke-linejoin="round"/>
    <!-- Блик -->
    <polygon points="0,-160 47,-50 165,-50 70,22 0,0" fill="#fffbeb" opacity="0.35"/>
  </g>

  <!-- Маленькие искры -->
  <g fill="#fef3c7" filter="url(#sparkle)">
    <circle cx="180" cy="240" r="10"/>
    <circle cx="860" cy="260" r="14"/>
    <circle cx="160" cy="780" r="8"/>
    <circle cx="880" cy="800" r="11"/>
    <circle cx="512" cy="120" r="6"/>
  </g>
  <g fill="#fde68a">
    <path d="M 220 880 l 0 -28 M 206 866 l 28 0" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
    <path d="M 820 140 l 0 -22 M 809 129 l 22 0" stroke="#fde68a" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
