[package]
name = "operator-desktop"
version = "8.0.0-beta.6"
description = "Живая Сказка — Десктоп оператора чата"
authors = ["Zhivaya Skazka"]
edition = "2021"

[lib]
name = "operator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
tauri-plugin-updater = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
keyring = "4.2.0"
windows = { version = "0.61", features = ["Foundation_Collections", "Data_Xml_Dom", "UI_Notifications", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Notifications", "Win32_Security_Cryptography"] }
windows-registry = "0.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.61"
